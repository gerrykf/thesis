# Nginx 配置 - 将 /uploads/ 反向代理到 Node.js
# 用于解决Docker容器文件系统隔离问题

server {
    listen 80 ;
    listen 443 ssl ;
    server_name healthmanage.xin;
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/frontend/log/access.log main;
    error_log /www/sites/frontend/log/error.log;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known {
        allow all;
        root /usr/share/nginx/html;
    }

    # 上传文件反向代理到Node.js（解决Docker容器隔离问题）
    location /uploads/ {
        # 方案A: 反向代理到Node.js（推荐，简单快速）
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存配置（可选）
        proxy_cache_valid 200 30d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 原配置（Docker容器隔离导致无法访问，已注释）
    # location /uploads/ {
    #     alias /opt/1panel/www/sites/healthbackend/index/server_upload/uploads/;
    #     add_header Access-Control-Allow-Origin *;
    #     add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #     autoindex off;
    # }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    root /www/sites/frontend/index/github/workspace/程序实现文档/frontend/h5-app/dist;
    error_page 404 /404.html;
    http2 on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/frontend/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/frontend/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000";
    include /www/sites/frontend/proxy/*.conf;
}

proxy_cache_path /www/sites/frontend/cache levels=1:2 keys_zone=proxy_cache_zone_of_frontend:5m max_size=1m inactive=24h;
